<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ซุ้มสหายเพชรคลองไพร789</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  fontFamily: { head: ['Mitr','sans-serif'], body: ['Sarabun','sans-serif'] },
  colors: { blood: { 600:'#8a1c2b', 700:'#6e1422', 800:'#4f0e18', 900:'#33090f' }, gold: { 300:'#ecd28a', 400:'#d9b45a', 500:'#c9a13b', 600:'#a98128' } }
} } }
</script>
<style>
  body { font-family: 'Sarabun', sans-serif; background:#0c0c0d; color:#e8e4da; }
  .field { width:100%; background:#17171a; border:1px solid #2e2e34; color:#f1ede3; border-radius:.5rem; padding:.55rem .75rem; outline:none; }
  .field:focus { border-color:#c9a13b; box-shadow:0 0 0 2px rgba(201,161,59,.25); }
  select.field option { background:#17171a; }
  .btn-gold { background:linear-gradient(180deg,#d9b45a,#b58b2e); color:#1a1205; font-weight:600; }
  .btn-gold:hover { filter:brightness(1.08); }
  .btn-gold:disabled { opacity:.5; cursor:not-allowed; }
  .btn-blood { background:#8a1c2b; color:#fff; }
  .btn-blood:hover { background:#a02234; }
  .card { background:#141417; border:1px solid #2a2a30; border-top:2px solid #8a1c2b; }
  .modal-box { animation: pop .15s ease-out; }
  @keyframes pop { from { transform:scale(.96); opacity:0 } to { transform:scale(1); opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .modal-box { animation:none } }
  :focus-visible { outline:2px solid #d9b45a; outline-offset:2px; }
</style>
</head>
<body class="min-h-screen">

<header class="border-b border-gold-600/40 bg-gradient-to-b from-blood-800 to-[#0c0c0d]">
  <div class="max-w-4xl mx-auto px-3 py-5 flex items-center justify-between gap-3">
    <div>
      <h1 class="font-head text-xl sm:text-3xl text-gold-400 leading-tight">ซุ้มสหายเพชรคลองไพร789</h1>
      <p class="text-xs sm:text-sm text-gray-400 mt-1">ระบบจัดการสายเลือดไก่ชน</p>
    </div>
    <button id="btnSettings" class="shrink-0 border border-gold-600/60 text-gold-400 rounded-lg px-3 py-2 text-sm hover:bg-gold-500/10">ตั้งค่า</button>
  </div>
</header>

<main class="max-w-4xl mx-auto px-3 py-4">
  <div class="flex flex-col sm:flex-row gap-2 mb-2">
    <div class="flex-1"><label class="sr-only" for="q">ค้นหา</label><input id="q" type="search" class="field" aria-label="ค้นหา"></div>
    <div class="sm:w-56"><label class="sr-only" for="sort">เรียงลำดับ</label>
      <select id="sort" class="field">
        <option value="latest">ล่าสุด</option>
        <option value="code_asc">รหัสไก่ A-Z</option>
        <option value="code_desc">รหัสไก่ Z-A</option>
        <option value="name">ชื่อไก่</option>
        <option value="breed">สายพันธุ์</option>
        <option value="sire">พ่อ</option>
        <option value="dam">แม่</option>
      </select>
    </div>
    <button id="btnAdd" class="btn-gold rounded-lg px-4 py-2">เพิ่มไก่</button>
  </div>
  <div class="flex items-center justify-between text-xs text-gray-500 mb-3">
    <span id="count"></span><span id="status"></span>
  </div>
  <div id="grid" class="grid grid-cols-2 gap-2 sm:gap-3"></div>
  <div id="empty" class="hidden text-center text-gray-500 py-16">ยังไม่มีข้อมูล กดปุ่ม “เพิ่มไก่” เพื่อบันทึกตัวแรก</div>
</main>

<!-- Form modal -->
<div id="formModal" class="hidden fixed inset-0 z-40 bg-black/80 overflow-y-auto">
  <div class="min-h-full flex items-center justify-center p-3">
    <div class="modal-box w-full max-w-lg bg-[#121215] border border-gold-600/50 rounded-xl p-4 sm:p-5">
      <h2 id="formTitle" class="font-head text-lg text-gold-400 mb-3"></h2>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-300 mb-1" for="f_code">รหัสไก่</label><input id="f_code" class="field" autocomplete="off"></div>
        <div><label class="block text-sm text-gray-300 mb-1" for="f_name">ชื่อไก่</label><input id="f_name" class="field" autocomplete="off"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-sm text-gray-300 mb-1" for="f_sire">พ่อ</label><input id="f_sire" class="field" autocomplete="off"></div>
          <div><label class="block text-sm text-gray-300 mb-1" for="f_dam">แม่</label><input id="f_dam" class="field" autocomplete="off"></div>
        </div>
        <div><label class="block text-sm text-gray-300 mb-1" for="f_breed">สายพันธุ์</label><input id="f_breed" class="field" autocomplete="off"></div>
        <div><label class="block text-sm text-gray-300 mb-1" for="f_dob">วันเกิด</label><input id="f_dob" type="date" class="field [color-scheme:dark]"></div>
        <div>
          <label class="block text-sm text-gray-300 mb-1" for="f_file">รูปภาพ</label>
          <input id="f_file" type="file" accept="image/*" class="field text-sm file:mr-3 file:border-0 file:rounded file:bg-blood-600 file:text-white file:px-3 file:py-1">
          <div class="mt-2 flex items-center gap-3">
            <img id="f_preview" alt="" class="hidden w-20 h-20 object-cover rounded-lg border border-gold-600/50">
            <span id="f_imgStatus" class="text-xs text-gray-400"></span>
          </div>
        </div>
      </div>
      <p id="formErr" class="text-sm text-red-400 mt-3 hidden"></p>
      <div class="flex justify-end gap-2 mt-4">
        <button id="formCancel" class="px-4 py-2 rounded-lg border border-gray-600 text-gray-300 hover:bg-white/5">ยกเลิก</button>
        <button id="formSave" class="btn-gold px-5 py-2 rounded-lg">บันทึก</button>
      </div>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div id="setModal" class="hidden fixed inset-0 z-40 bg-black/80 overflow-y-auto">
  <div class="min-h-full flex items-center justify-center p-3">
    <div class="modal-box w-full max-w-lg bg-[#121215] border border-gold-600/50 rounded-xl p-4 sm:p-5">
      <h2 class="font-head text-lg text-gold-400 mb-1">ตั้งค่าการเชื่อมต่อ</h2>
      <p class="text-xs text-gray-400 mb-3">ค่าทั้งหมดถูกเก็บในเบราว์เซอร์ของคุณเท่านั้น (localStorage)</p>
      <div class="space-y-3">
        <div><label class="block text-sm text-gray-300 mb-1" for="s_imgbb">ImgBB API Key</label><input id="s_imgbb" type="password" class="field" autocomplete="off"></div>
        <div><label class="block text-sm text-gray-300 mb-1" for="s_pat">GitHub Personal Access Token</label><input id="s_pat" type="password" class="field" autocomplete="off"></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="block text-sm text-gray-300 mb-1" for="s_user">GitHub Username</label><input id="s_user" class="field" autocomplete="off"></div>
          <div><label class="block text-sm text-gray-300 mb-1" for="s_repo">ชื่อ Repository</label><input id="s_repo" class="field" autocomplete="off"></div>
        </div>
        <label class="flex items-center gap-2 text-sm text-gray-400"><input id="s_show" type="checkbox" class="accent-yellow-600"> แสดงคีย์</label>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button id="setCancel" class="px-4 py-2 rounded-lg border border-gray-600 text-gray-300 hover:bg-white/5">ปิด</button>
        <button id="setSave" class="btn-gold px-5 py-2 rounded-lg">บันทึกการตั้งค่า</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm delete modal -->
<div id="delModal" class="hidden fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-3">
  <div class="modal-box w-full max-w-sm bg-[#121215] border border-blood-600 rounded-xl p-5 text-center">
    <h2 class="font-head text-lg text-gold-400 mb-2">ยืนยันการลบ</h2>
    <p class="text-sm text-gray-300">ต้องการลบ <span id="delName" class="text-gold-300 font-semibold"></span> ออกจากระบบหรือไม่ การลบไม่สามารถย้อนกลับได้</p>
    <div class="flex justify-center gap-2 mt-5">
      <button id="delCancel" class="px-4 py-2 rounded-lg border border-gray-600 text-gray-300 hover:bg-white/5">ยกเลิก</button>
      <button id="delOk" class="btn-blood px-5 py-2 rounded-lg">ลบข้อมูล</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] max-w-[90%] px-4 py-2 rounded-lg text-sm shadow-lg"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const LS_CFG = 'sahai789_cfg', LS_DATA = 'sahai789_data';
  const FILE = 'data.json';
  let cfg = { imgbb:'', pat:'', user:'', repo:'' };
  let items = [], sha = null, editingId = null, pendingDelete = null, uploading = false, imgUrl = '';

  try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(LS_CFG) || '{}')); } catch(e) {}

  const ghReady = () => cfg.user && cfg.repo;
  const ghWritable = () => ghReady() && cfg.pat;
  const apiUrl = () => `https://api.github.com/repos/${encodeURIComponent(cfg.user)}/${encodeURIComponent(cfg.repo)}/contents/${FILE}`;
  const ghHeaders = () => { const h = { 'Accept':'application/vnd.github+json' }; if (cfg.pat) h['Authorization'] = 'Bearer ' + cfg.pat; return h; };
  const b64enc = s => btoa(unescape(encodeURIComponent(s)));
  const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function toast(msg, ok = true) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] max-w-[90%] px-4 py-2 rounded-lg text-sm shadow-lg ' + (ok ? 'bg-gold-500 text-black' : 'bg-blood-600 text-white');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 3200);
  }
  const setStatus = s => $('status').textContent = s;

  /* ---------- Storage ---------- */
  function saveLocal() { try { localStorage.setItem(LS_DATA, JSON.stringify(items)); } catch(e) {} }

  async function loadData() {
    try { items = JSON.parse(localStorage.getItem(LS_DATA) || '[]'); } catch(e) { items = []; }
    render();
    if (!ghReady()) { setStatus('โหมดออฟไลน์ (เก็บในเครื่อง)'); return; }
    setStatus('กำลังโหลดจาก GitHub...');
    try {
      const r = await fetch(apiUrl() + '?t=' + Date.now(), { headers: ghHeaders(), cache:'no-store' });
      if (r.status === 404) { sha = null; setStatus('ยังไม่มีไฟล์ data.json ใน Repository'); return; }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      sha = j.sha;
      const parsed = JSON.parse(b64dec(j.content) || '[]');
      items = Array.isArray(parsed) ? parsed : [];
      saveLocal(); render();
      setStatus(ghWritable() ? 'เชื่อมต่อ GitHub แล้ว' : 'อ่านอย่างเดียว (ยังไม่ได้ใส่ Token)');
    } catch(e) {
      setStatus('โหลดจาก GitHub ไม่ได้ ใช้ข้อมูลในเครื่อง');
      toast('โหลดจาก GitHub ไม่สำเร็จ: ' + e.message, false);
    }
  }

  async function persist(message) {
    saveLocal();
    if (!ghWritable()) { setStatus('บันทึกในเครื่องแล้ว (ยังไม่ได้เชื่อม GitHub)'); return true; }
    setStatus('กำลังบันทึกไป GitHub...');
    const body = () => JSON.stringify({ message, content: b64enc(JSON.stringify(items, null, 2)), ...(sha ? { sha } : {}) });
    const put = () => fetch(apiUrl(), { method:'PUT', headers: { ...ghHeaders(), 'Content-Type':'application/json' }, body: body() });
    try {
      let r = await put();
      if (r.status === 409 || r.status === 422) {
        const g = await fetch(apiUrl() + '?t=' + Date.now(), { headers: ghHeaders(), cache:'no-store' });
        if (g.ok) { sha = (await g.json()).sha; r = await put(); }
      }
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || 'HTTP ' + r.status); }
      sha = (await r.json()).content.sha;
      setStatus('บันทึกไป GitHub แล้ว');
      return true;
    } catch(e) {
      setStatus('บันทึกไป GitHub ไม่สำเร็จ (เก็บในเครื่องแล้ว)');
      toast('GitHub: ' + e.message, false);
      return false;
    }
  }

  /* ---------- Age ---------- */
  function age(dob) {
    if (!dob) return '-';
    const d = new Date(dob), n = new Date();
    if (isNaN(d)) return '-';
    let m = (n.getFullYear() - d.getFullYear()) * 12 + n.getMonth() - d.getMonth();
    if (n.getDate() < d.getDate()) m--;
    if (m < 0) return '-';
    const y = Math.floor(m / 12), mo = m % 12;
    if (!y && !mo) return 'ไม่ถึง 1 เดือน';
    return (y ? y + ' ปี ' : '') + (mo ? mo + ' เดือน' : '').trim();
  }
  const thDate = s => { const d = new Date(s); return isNaN(d) ? '-' : d.toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' }); };

  /* ---------- Render ---------- */
  function render() {
    const q = $('q').value.trim().toLowerCase();
    let list = items.filter(i => !q || [i.code,i.name,i.sire,i.dam,i.breed].some(v => String(v||'').toLowerCase().includes(q)));
    const cmp = k => (a,b) => String(a[k]||'').localeCompare(String(b[k]||''), 'th', { numeric:true });
    const s = $('sort').value;
    if (s === 'latest') list.sort((a,b) => (b.created||0) - (a.created||0));
    else if (s === 'code_asc') list.sort(cmp('code'));
    else if (s === 'code_desc') list.sort((a,b) => cmp('code')(b,a));
    else list.sort(cmp(s));
    $('count').textContent = `แสดง ${list.length} จาก ${items.length} ตัว`;
    $('empty').classList.toggle('hidden', items.length > 0);
    $('grid').innerHTML = list.map(i => `
      <article class="card rounded-lg overflow-hidden flex flex-col">
        <div class="aspect-square bg-black/40">
          ${i.image_url ? `<img src="${esc(i.image_url)}" alt="${esc(i.name)}" loading="lazy" class="w-full h-full object-cover">`
            : `<div class="w-full h-full flex items-center justify-center text-xs text-gray-600">ไม่มีรูป</div>`}
        </div>
        <div class="p-2 sm:p-3 flex-1 flex flex-col text-xs sm:text-sm">
          <div class="text-gold-400 font-head text-[11px] sm:text-xs break-all">${esc(i.code)}</div>
          <h3 class="font-head text-sm sm:text-base text-white leading-tight break-words">${esc(i.name)}</h3>
          <dl class="mt-1 space-y-0.5 text-gray-300">
            <div><dt class="inline text-gray-500">สายพันธุ์ </dt><dd class="inline">${esc(i.breed) || '-'}</dd></div>
            <div><dt class="inline text-gray-500">พ่อ </dt><dd class="inline">${esc(i.sire) || '-'}</dd></div>
            <div><dt class="inline text-gray-500">แม่ </dt><dd class="inline">${esc(i.dam) || '-'}</dd></div>
            <div><dt class="inline text-gray-500">อายุ </dt><dd class="inline text-gold-300">${age(i.dob)}</dd>${i.dob ? `<span class="text-gray-600 text-[10px]"> (${thDate(i.dob)})</span>` : ''}</div>
          </dl>
          <div class="mt-auto pt-2 grid grid-cols-2 gap-1.5">
            <button data-edit="${i.id}" class="border border-gold-600/60 text-gold-400 rounded py-1 hover:bg-gold-500/10">แก้ไข</button>
            <button data-del="${i.id}" class="btn-blood rounded py-1">ลบ</button>
          </div>
        </div>
      </article>`).join('');
  }

  /* ---------- Form ---------- */
  const open = id => $(id).classList.remove('hidden');
  const close = id => $(id).classList.add('hidden');
  const fields = ['code','name','sire','dam','breed','dob'];

  function setPreview(url) {
    imgUrl = url || '';
    $('f_preview').classList.toggle('hidden', !imgUrl);
    if (imgUrl) $('f_preview').src = imgUrl;
  }

  function openForm(id) {
    editingId = id || null;
    const it = items.find(x => x.id === id) || {};
    $('formTitle').textContent = id ? 'แก้ไขข้อมูลไก่' : 'เพิ่มไก่ใหม่';
    fields.forEach(f => $('f_' + f).value = it[f] || '');
    $('f_file').value = '';
    setPreview(it.image_url);
    $('f_imgStatus').textContent = it.image_url ? 'ใช้รูปเดิม เลือกไฟล์ใหม่เพื่อเปลี่ยน' : '';
    $('formErr').classList.add('hidden');
    open('formModal');
    $('f_code').focus();
  }

  $('f_file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!cfg.imgbb) { $('f_imgStatus').textContent = 'ยังไม่ได้ใส่ ImgBB API Key ในหน้าตั้งค่า'; e.target.value = ''; return; }
    uploading = true; $('formSave').disabled = true;
    $('f_imgStatus').textContent = 'กำลังอัปโหลดรูป...';
    try {
      const fd = new FormData(); fd.append('image', file);
      const r = await fetch('https://api.imgbb.com/1/upload?key=' + encodeURIComponent(cfg.imgbb), { method:'POST', body: fd });
      const j = await r.json();
      if (!r.ok || !j.success) throw new Error(j.error?.message || 'HTTP ' + r.status);
      setPreview(j.data.display_url);
      $('f_imgStatus').textContent = 'อัปโหลดรูปสำเร็จ';
    } catch(err) {
      $('f_imgStatus').textContent = 'อัปโหลดไม่สำเร็จ: ' + err.message;
    } finally { uploading = false; $('formSave').disabled = false; }
  });

  $('formSave').addEventListener('click', async () => {
    const v = {}; fields.forEach(f => v[f] = $('f_' + f).value.trim());
    if (!v.code || !v.name) { $('formErr').textContent = 'กรุณากรอกรหัสไก่และชื่อไก่'; $('formErr').classList.remove('hidden'); return; }
    if (uploading) return;
    const btn = $('formSave'); btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    v.image_url = imgUrl;
    let msg;
    if (editingId) {
      const i = items.findIndex(x => x.id === editingId);
      items[i] = { ...items[i], ...v, updated: Date.now() };
      msg = 'แก้ไข ' + v.code;
    } else {
      items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), ...v, created: Date.now() });
      msg = 'เพิ่ม ' + v.code;
    }
    render();
    const ok = await persist(msg);
    btn.disabled = false; btn.textContent = 'บันทึก';
    close('formModal');
    if (ok) toast('บันทึกข้อมูลแล้ว');
  });
  $('formCancel').addEventListener('click', () => close('formModal'));

  /* ---------- Delete ---------- */
  $('delCancel').addEventListener('click', () => { pendingDelete = null; close('delModal'); });
  $('delOk').addEventListener('click', async () => {
    const it = items.find(x => x.id === pendingDelete);
    if (!it) return close('delModal');
    items = items.filter(x => x.id !== pendingDelete);
    pendingDelete = null; close('delModal'); render();
    if (await persist('ลบ ' + it.code)) toast('ลบข้อมูลแล้ว');
  });

  $('grid').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.edit) openForm(b.dataset.edit);
    if (b.dataset.del) {
      const it = items.find(x => x.id === b.dataset.del);
      pendingDelete = it.id; $('delName').textContent = `${it.name} (${it.code})`; open('delModal');
    }
  });

  /* ---------- Settings ---------- */
  $('btnSettings').addEventListener('click', () => {
    $('s_imgbb').value = cfg.imgbb; $('s_pat').value = cfg.pat; $('s_user').value = cfg.user; $('s_repo').value = cfg.repo;
    open('setModal');
  });
  $('s_show').addEventListener('change', e => { $('s_imgbb').type = $('s_pat').type = e.target.checked ? 'text' : 'password'; });
  $('setCancel').addEventListener('click', () => close('setModal'));
  $('setSave').addEventListener('click', () => {
    cfg = { imgbb: $('s_imgbb').value.trim(), pat: $('s_pat').value.trim(), user: $('s_user').value.trim(), repo: $('s_repo').value.trim() };
    localStorage.setItem(LS_CFG, JSON.stringify(cfg));
    close('setModal'); toast('บันทึกการตั้งค่าแล้ว'); loadData();
  });

  $('btnAdd').addEventListener('click', () => openForm());
  $('q').addEventListener('input', render);
  $('sort').addEventListener('change', render);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') ['formModal','setModal','delModal'].forEach(close); });

  loadData();
})();
</script>
</body>
</html>
